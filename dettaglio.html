<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMeteo - Dettaglio</title>
    <link rel="icon" type="image/x-icon" href="src/img/logo/BGMeteo-Compact-Dark.ico">
    <link rel="stylesheet" href="dettaglio-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container dettaglio-container">
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Torna alla mappa
        </a>
        
        <div class="header-dettaglio">
            <h1 id="titoloComune">
                <i class="fas fa-location-dot"></i> Dettaglio Meteo
            </h1>
            <div class="last-update">
                <span id="ultimoAggiornamento"></span>
            </div>
        </div>
        
        <div class="meteo-attuale card">
            <div class="card-header">
                <h2><i class="fas fa-sun"></i> Meteo Attuale</h2>
            </div>
            <div id="datiAttuali" class="card-content">
                <div class="loading-spinner">
                    <div class="spinner"></div>
                    <p>Caricamento dati meteo...</p>
                </div>
            </div>
        </div>
        
        <div class="previsioni card">
            <div class="card-header">
                <h2><i class="fas fa-calendar-alt"></i> Previsioni 5 giorni</h2>
            </div>
            <div class="card-content">
                <div class="table-container">
                    <table id="tabellaPrevisioni">
                        <thead>
                            <tr>
                                <th><i class="far fa-calendar"></i> Data</th>
                                <th><i class="fas fa-cloud"></i> Condizione</th>
                                <th><i class="fas fa-temperature-high"></i> Max (°C)</th>
                                <th><i class="fas fa-temperature-low"></i> Min (°C)</th>
                                <th><i class="fas fa-tint"></i> Precipitazioni (mm)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Verrà popolato via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    
    <script src="dettaglio.js"></script>
</body>
</html>
