<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>BGMETEO</title>

    <script src="main.js" defer></script>
</head>
<body>
    <h1>BGMeteo</h1>
    <h3>Scopri il meteo di tutta Italia. Efficiente e sicuro.</h3>
    <p>
        Iniziamo subito!
    </p>
    <form id="meteoForm">
       
        <p>Seleziona una provincia:</p>
        
        <input type="text" name="provincia" id="provinciaInput" list="cityname" placeholder="Inserisci il nome della provincia">
        <datalist id="cityname">
            <!-- Le opzioni saranno aggiunte dinamicamente -->
        </datalist>
        
        <br>

    

        <select name="selezionaProvincia"></select><br>
        
        <p>Seleziona un comune della provincia:</p>
        <select name="selezionaComune">
            <option value="">Seleziona un comune</option>
        </select>
        <br>
        

    </form>
    <h2>Risultato:</h2>
    <pre id="output">Premi un pulsante per visualizzare il risultato.</pre>
</body>
</html>
