<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMeteo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    <div class="container">
        <h1>App Meteo Comuni Italiani</h1>
        
        <div class="controls">
            <div class="select-group">
                <label for="selectRegione">Regione:</label>
                <select id="selectRegione">
                    <option value="">Seleziona una regione...</option>
                </select>
            </div>
            
            <div class="select-group">
                <label for="selectProvincia">Provincia:</label>
                <select id="selectProvincia">
                    <option value="">Seleziona una provincia...</option>
                </select>
            </div>
            
            <div class="select-group">
                <label for="selectComune">Comune:</label>
                <select id="selectComune">
                    <option value="">Seleziona un comune...</option>
                </select>
            </div>
        </div>
        
        <div id="map"></div>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="main.js"></script>
</body>
</html>
