<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>BGMETEO</title>

    <script src="main.js" defer></script>
</head>
<body>
    <h1>BGMeteo</h1>
    <h3>Scopri il meteo di tutta Italia. Efficiente e sicuro.</h3>
    <p>
        Iniziamo subito!
    </p>
    <form id="meteoForm">
        
        
        <!-- SELEZIONE DELLA PROVINCIA -->
        <p>Seleziona una provincia:</p>
        <input type="text" name="provincia" id="provinciaInput" list="listaProvince" placeholder="Inserisci il nome della provincia">
        <datalist id="listaProvince">
            <!-- opzioni che verranno aggiuntre tramite il js -->
        </datalist>
         <br>


        <!-- SELEZIONE DEL COMUNE -->
        <p>Seleziona un comune della provincia:</p>
        <input type="text" name="comune" id="comuneInput" list="listaComuni" placeholder="Inserisci il nome del comune">
        <datalist id="listaComuni">
            <!-- Le opzioni saranno aggiunte dinamicamente -->
        </datalist>
        <br>
        
        CIAO

    </form>
    <div id="map"></div>            
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </div>
    <h2>Risultato:</h2>
    <pre id="output">Premi un pulsante per visualizzare il risultato.</pre>
</body>
</html>
