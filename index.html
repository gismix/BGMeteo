<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMeteo</title>
    <link rel="icon" type="image/x-icon" href="src/img/logo/BGMeteo-Compact-Dark.ico">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="src/img/logo/BGMeteo-Compact-Dark.ico">
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid px-0">
        <!-- Header -->
        <header class="bg-primary text-white py-4 shadow">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-12 text-center">
                        <img src="src/img/logo/BGMeteo-Complete-dark.png" alt="BGMeteo Logo" class="mb-2" style="height: 150px;">
                        <h2 class="subtitle text-light opacity-100" id="subtitle">Previsioni meteo italiane</h2>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container py-4">
            <!-- Controls Section -->
            <section class="controls-section mb-4">
                <div class="row g-3 align-items-end">
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="selectRegione" class="form-label fw-bold">Seleziona una Regione:</label>
                            <select id="selectRegione" class="form-select form-select-lg">
                                <option value="">Regione</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="selectProvincia" class="form-label fw-bold">Seleziona una Provincia:</label>
                            <select id="selectProvincia" class="form-select form-select-lg">
                                <option value="">Provincia</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-4">
                        <div class="form-group">
                            <label for="selectComune" class="form-label fw-bold">Seleziona un Comune:</label>
                            <select id="selectComune" class="form-select form-select-lg">
                                <option value="">Comune</option>
                            </select>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Map Section -->
            <section class="map-section">
                <div class="card shadow">
                    <div class="card-header bg-light py-3">
                        <h5 class="card-title mb-0">Mappa Italia</h5>
                    </div>
                    <div class="card-body p-0">
                        <div id="map"></div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="bg-dark text-white py-3 mt-4">
            <div class="container">
                <div class="row">
                    <div class="col-12 text-center">
                        <p class="mb-0">Contattaci - <a href="mailto:bgmeteo@libero.it">BGMeteo@libero.it</a></p>
                        <p class="mb-0">BGMeteo &copy; 2025 - Previsioni Meteo in Tempo Reale</p>
                        
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="main.js"></script>
</body>
</html>
